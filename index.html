<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oussama BEY — Researcher in Automatic Control and Robotics</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #172033;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .hero-content {
            width: 100%;
            max-width: 1000px;
            padding: 70px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .label {
            margin-bottom: 18px;
            color: #3157a4;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 18px;
            font-size: 64px;
            line-height: 1.1;
        }

        .title {
            max-width: 700px;
            color: #586174;
            font-size: 24px;
            line-height: 1.5;
        }

        .line {
            width: 80px;
            height: 4px;
            margin-top: 30px;
            background: #3157a4;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            .hero-content {
                padding: 45px 28px;
            }

            h1 {
                font-size: 42px;
            }

            .title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="hero">
        <section class="hero-content">
            <p class="label">Academic Portfolio</p>

            <h1>Oussama BEY</h1>

            <p class="title">
                Researcher in Automatic Control and Robotics
            </p>

            <div class="line"></div>
        </section>
    </main>
</body>
</html>
